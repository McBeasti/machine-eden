[project]
name = "machine-eden-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "numpy>=2.1.0",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "websockets>=13.0",
  "python-multipart>=0.0.12",
]

[tool.vercel]
entrypoint = "main:app"
